name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 (Apple requires the iOS 26 SDK)
        run: |
          echo "::notice title=xcodes::$(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=xcode::No Xcode 26 installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=selected::$(xcodebuild -version | tr '\n' ' ')"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile') }}

      - name: Install VLC engine (CocoaPods)
        run: |
          set -o pipefail
          command -v pod >/dev/null || sudo gem install cocoapods
          pod install --repo-update 2>&1 | tail -20

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace VISION.xcworkspace \
            -scheme VISION \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Report compile/test errors
        if: failure()
        run: |
          grep -E "error:|\*\* (BUILD|TEST) FAILED|Test Case .* failed|XCTAssert" build.log | sort -u | head -15 | cut -c1-900 \
            | while IFS= read -r line; do echo "::error title=build::$line"; done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
