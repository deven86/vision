name: TestFlight

# Manual only — nothing is ever uploaded without you pressing "Run workflow".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD to send this build to TestFlight'
        required: true

jobs:
  upload:
    if: ${{ github.event.inputs.confirm == 'UPLOAD' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    environment: release        # add required reviewers to this environment in GitHub for a second approval
    permissions:
      contents: read
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 (Apple requires the iOS 26 SDK)
        run: |
          echo "::notice title=xcodes::$(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=xcode::No Xcode 26 installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=selected::$(xcodebuild -version | tr '\n' ' ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile') }}

      - name: Install VLC engine (CocoaPods)
        run: |
          set -o pipefail
          command -v pod >/dev/null || sudo gem install cocoapods
          pod install --repo-update 2>&1 | tail -20

      - name: Write App Store Connect API key (temporary, runner only)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Install signing (read-only)
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          PW=$(printf '%s' "${{ secrets.ASC_KEY_P8_BASE64 }}" | shasum -a 256 | cut -d' ' -f1)
          echo "::add-mask::$PW"
          AUTH=$(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8" MATCH_PASSWORD="$PW" MATCH_GIT_AUTH="$AUTH" APP_IDS=com.jondhale.vision
          set +e
          fastlane signing_install > "$RUNNER_TEMP/match.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/match.log"
          if [ $status -ne 0 ]; then
            grep -iE "error|fail|not found|invalid|\[!\]|run .*signing" "$RUNNER_TEMP/match.log" | tail -8 | cut -c1-900 \
              | while IFS= read -r line; do echo "::error title=signing::$line"; done
            exit $status
          fi

      - name: Archive (signed with distribution cert from match)
        run: |
          set +e
          xcodebuild archive \
            -workspace VISION.xcworkspace \
            -scheme VISION \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VISION.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/archive.log"
          if [ $status -ne 0 ]; then
            grep -E "error:|error -|: error|requires a provisioning profile|No profiles|No Account|No signing certificate|maximum number|Provisioning profile" "$RUNNER_TEMP/archive.log" \
              | sort -u | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=archive::$line"; done
            exit $status
          fi

      - name: Export and upload to App Store Connect
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VISION.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          tail -60 "$RUNNER_TEMP/export.log"
          if [ $status -ne 0 ]; then
            # Surface the real reason as annotations (readable without opening the raw log)
            grep -iE "error|fail|requires|profile|certificate|denied|not (found|allowed)|invalid" "$RUNNER_TEMP/export.log" \
              | grep -v "^\s*$" | tail -8 | cut -c1-900 | while IFS= read -r line; do echo "::error title=export::$line"; done
            DIST=$(grep -oE "/[^ ]*\.xcdistributionlogs" "$RUNNER_TEMP/export.log" | head -1)
            if [ -n "$DIST" ] && [ -d "$DIST" ]; then
              grep -rhiE "error|fail|denied|invalid|requires" "$DIST" 2>/dev/null | grep -viE "^\s*$" \
                | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=distribution::$line"; done
            fi
            exit $status
          fi

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
