name: TestFlight

# Manual only — nothing is ever uploaded without you pressing "Run workflow".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD to send this build to TestFlight'
        required: true

jobs:
  upload:
    if: ${{ github.event.inputs.confirm == 'UPLOAD' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    environment: release        # add required reviewers to this environment in GitHub for a second approval
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key (temporary, runner only)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive (unsigned; signed by Apple cloud signing at export)
        run: |
          set +e
          xcodebuild archive \
            -project VISION.xcodeproj \
            -scheme VISION \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VISION.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/archive.log"
          if [ $status -ne 0 ]; then
            grep -E "error:|error -|: error|requires a provisioning profile|No profiles|No Account|No signing certificate|maximum number|Provisioning profile" "$RUNNER_TEMP/archive.log" \
              | sort -u | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=archive::$line"; done
            exit $status
          fi

      - name: Export and upload to App Store Connect
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VISION.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          tail -60 "$RUNNER_TEMP/export.log"
          if [ $status -ne 0 ]; then
            # Surface the real reason as annotations (readable without opening the raw log)
            grep -iE "error|fail|requires|profile|certificate|denied|not (found|allowed)|invalid" "$RUNNER_TEMP/export.log" \
              | grep -v "^\s*$" | tail -8 | cut -c1-900 | while IFS= read -r line; do echo "::error title=export::$line"; done
            DIST=$(grep -oE "/[^ ]*\.xcdistributionlogs" "$RUNNER_TEMP/export.log" | head -1)
            if [ -n "$DIST" ] && [ -d "$DIST" ]; then
              grep -rhiE "error|fail|denied|invalid|requires" "$DIST" 2>/dev/null | grep -viE "^\s*$" \
                | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=distribution::$line"; done
            fi
            exit $status
          fi

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
