name: VISION
options:
  bundleIdPrefix: com.jondhale
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Set your Apple Team ID (or pass DEVELOPMENT_TEAM=... in CI)
    CODE_SIGN_STYLE: Automatic

targets:
  VISION:
    type: application
    platform: iOS
    sources:
      - path: VISION
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.vision
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VISION/VISION.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: VISION/Info.plist
      properties:
        CFBundleDisplayName: VISION
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: VISION uses Face ID to unlock your private vault.
        NSPhotoLibraryAddUsageDescription: VISION saves photos and videos you choose to export to your Photos library.
        ITSAppUsesNonExemptEncryption: false   # only Apple OS crypto (CryptoKit) — exempt; skips the compliance prompt per build
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: VISION/VISION.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete

  VISIONTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VISIONTests
    dependencies:
      - target: VISION
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.vision.tests

schemes:
  VISION:
    build:
      targets:
        VISION: all
        VISIONTests: [test]
    test:
      targets:
        - VISIONTests
    archive:
      config: Release
