name: VISION
options:
  bundleIdPrefix: com.jondhale
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Set your Apple Team ID (or pass DEVELOPMENT_TEAM=... in CI)
    CODE_SIGN_STYLE: Automatic

targets:
  VISION:
    type: application
    platform: iOS
    sources:
      - path: VISION
    dependencies:
      - target: VISIONShare
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.vision"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.vision
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: VISION/VISION.entitlements
        ENABLE_PREVIEWS: YES
    info:
      path: VISION/Info.plist
      properties:
        CFBundleDisplayName: VISION
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: VISION uses Face ID to unlock your private vault.
        NSPhotoLibraryAddUsageDescription: VISION saves photos and videos you choose to export to your Photos library.
        VISIONKeychainGroup: $(AppIdentifierPrefix)com.jondhale.vision.shared
        ITSAppUsesNonExemptEncryption: false   # only Apple OS crypto (CryptoKit) — exempt; skips the compliance prompt per build
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: VISION/VISION.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.security.application-groups:
          - group.com.jondhale.vision
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jondhale.vision.shared

  VISIONShare:
    type: app-extension
    platform: iOS
    sources:
      - path: VISIONShare
      - path: VISION/Shared
        group: VISIONShare/Shared
      - path: VISION/App/Theme.swift
        group: VISIONShare/Shared
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.vision.share"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.vision.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: VISIONShare/VISIONShare.entitlements
        SKIP_INSTALL: YES
    info:
      path: VISIONShare/Info.plist
      properties:
        CFBundleDisplayName: VISION
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VISIONKeychainGroup: $(AppIdentifierPrefix)com.jondhale.vision.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att,
              ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR
              ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie").@count >= 1).@count >= 1
    entitlements:
      path: VISIONShare/VISIONShare.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.security.application-groups:
          - group.com.jondhale.vision
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jondhale.vision.shared

  VISIONTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VISIONTests
    dependencies:
      - target: VISION
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.vision.tests

schemes:
  VISION:
    build:
      targets:
        VISION: all
        VISIONTests: [test]
    test:
      targets:
        - VISIONTests
    archive:
      config: Release
